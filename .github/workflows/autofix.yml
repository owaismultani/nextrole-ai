name: autofix.ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autofix:
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-32vcpu-ubuntu-2404' || 'ubuntu-latest' }}

    steps:
      - name: Checkout Repository
        if: ${{ vars.USE_BLACKSMITH != 'true' }}
        uses: actions/checkout@v7

      - name: Checkout Repository (Blacksmith)
        if: ${{ vars.USE_BLACKSMITH == 'true' }}
        uses: useblacksmith/checkout@v1

      - name: Check for merge conflict markers
        run: |
          if git grep -nEI '<{7} |>{7} |^={7}$' -- ':(exclude)*.md' ':(exclude)*.mdx'; then
            echo "::error::Merge conflict markers found in tracked files"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove Unused Dependencies
        run: |
          pnpm knip --fix
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Lint and Format
        run: pnpm check

      # No external autofix.ci installation is required. CI must not silently
      # discard formatter/Knip changes; contributors commit the generated diff.
      - name: Verify formatting and dependency fixes are committed
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::Knip or formatting produced uncommitted changes. Run 'pnpm knip --fix && pnpm install --no-frozen-lockfile --ignore-scripts && pnpm check' locally and commit the result."
            git diff --stat
            exit 1
          fi
